name: Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js app
      run: npm run build
      env:
        # Variables de entorno falsas para que Next.js no falle si intenta
        # hacer renderizado estático de alguna página durante el build.
        API_NODE: 'http://localhost:3010'
        URL_DYNAMICS: 'http://localhost'
